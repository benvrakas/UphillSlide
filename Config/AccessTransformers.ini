[AccessTransformers]
; Reads and sets the steepest slope, as an angle from straight down, a player may keep sliding at.
Accessor=(Class="UFGCharacterMovementComponent", Property="mMaxSlideAngle")
; Reads and swaps the curve that sets how fast a slide runs out at each slope angle.
Accessor=(Class="UFGCharacterMovementComponent", Property="mSlopeCurve")
; Reads the slide timer and slide speed curve to fade a slide's entry speed.
Friend=(Class="UFGCharacterMovementComponent", FriendClass="FUSSlideMomentum")
